apiVersion: apps/v1

kind: Deployment

metadata:
  name: ingress-demo-backend

  namespace: ingress-demo

  labels:
    app.kubernetes.io/name: ingress-demo-backend
    app.kubernetes.io/part-of: ingress-demo
    app.kubernetes.io/component: backend
    app: ingress-demo-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ingress-demo-backend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: ingress-demo-backend
        app.kubernetes.io/name: ingress-demo-backend
        app.kubernetes.io/part-of: ingress-demo
        app.kubernetes.io/component: backend

      annotations:
        description: "Spring Boot REST API backend for the Ingress demo"
        prometheus.io/scrape: "false"

    spec:

      restartPolicy: Always

      containers:
        - name: backend

          image: ingress-demo-backend:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          env:
            - name: PORT
              value: "8080"

            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m"

            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
            successThreshold: 1
