apiVersion: v1

kind: Service

metadata:
  name: ingress-demo-frontend
  namespace: ingress-demo

  labels:
    app.kubernetes.io/name: ingress-demo-frontend
    app.kubernetes.io/part-of: ingress-demo
    app: ingress-demo-frontend

spec:
  type: ClusterIP

  selector:
    app: ingress-demo-frontend

  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
