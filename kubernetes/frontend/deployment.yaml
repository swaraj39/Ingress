apiVersion: apps/v1

kind: Deployment

metadata:
  name: ingress-demo-frontend
  namespace: ingress-demo

  labels:
    app.kubernetes.io/name: ingress-demo-frontend
    app.kubernetes.io/part-of: ingress-demo
    app.kubernetes.io/component: frontend
    app: ingress-demo-frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ingress-demo-frontend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: ingress-demo-frontend
        app.kubernetes.io/name: ingress-demo-frontend
        app.kubernetes.io/part-of: ingress-demo
        app.kubernetes.io/component: frontend

      annotations:
        description: "React frontend served by nginx"

    spec:
      restartPolicy: Always

      containers:
        - name: frontend

          image: ingress-demo-frontend:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 80
              name: http
              protocol: TCP

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          startupProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 10
            successThreshold: 1
